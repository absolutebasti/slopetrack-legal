<script>
// Short invite links /d/CODE and /f/CODE (the app's share links) → the invite
// page with the code in the query; GitHub Pages cannot rewrite paths. With the
// app installed, iOS opens the app directly (apple-app-site-association).
(function(){
  var m=location.pathname.match(/^\/(d|f)\/([A-Za-z0-9]{6})\/?$/);
  if(m){location.replace('/'+m[1]+'/?c='+m[2].toUpperCase());}
})();
</script>
