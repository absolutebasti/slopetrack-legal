<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B0C0E">
<title>SlopeTrack – Ski-Tracker</title>
<meta name="description" content="Ein Tipp startet den Skitag: Abfahrten, Höhenmeter, Tempo – dazu Ranglisten und Duelle mit Freunden. Gratis fürs iPhone.">
<meta property="og:title" content="SlopeTrack – Ski-Tracker"><meta property="og:description" content="Abfahrten, Höhenmeter, Tempo – und Duelle mit Freunden. Gratis fürs iPhone."><meta property="og:image" content="https://slopetrack.torchtechnology.de/img/icon.png"><meta name="twitter:card" content="summary">
<style>
:root{--bg:#0B0C0E;--card:#15171B;--ink:#F4F1EA;--muted:#A9ABB2;--accent:#E3C88C;--hair:#2A2D33;--onaccent:#0B0C0E}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,Inter,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
main{max-width:680px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(112px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
a{color:var(--accent)}
p{margin:0 0 12px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 28px;padding:8px 0 6px;border-bottom:1px solid var(--hair);margin:0 0 40px}
.brand{display:inline-flex;align-items:center;gap:10px;padding:4px 0;color:var(--ink);text-decoration:none}
.brand strong{font-size:18px;letter-spacing:.02em}
.mark{width:28px;height:28px;border-radius:8px;background:var(--accent);position:relative;flex:none}
.mark:after{content:'';position:absolute;left:7px;top:8px;width:14px;height:14px;border-left:3px solid var(--bg);border-bottom:3px solid var(--bg);transform:rotate(-45deg)}
.top nav{display:flex;gap:24px}
.top nav a{color:var(--muted);text-decoration:none;font-size:15px;line-height:20px;padding:12px 0}
.top nav a:hover,.top nav a[aria-current="page"]{color:var(--ink)}
.top nav a[aria-current="page"]{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:8px}
@media (max-width:599px){.top nav{flex:1 0 100%;justify-content:space-between;gap:0}}
@media (max-width:359px){.top nav a{font-size:14px}}
h1{font-size:clamp(28px,7.5vw,36px);line-height:1.15;letter-spacing:-.015em;margin:0 0 10px}
h2{font-size:18px;line-height:1.35;margin:32px 0 8px}
.head{text-align:center;margin:0 0 32px}
.lead{font-size:17px;color:var(--muted);margin:0}
.center{text-align:center}
.overline{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--hair);border-radius:20px;padding:28px 20px;margin:0 0 40px;text-align:center}
.card>:last-child{margin-bottom:0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;max-width:340px;height:52px;margin:12px auto 0;padding:0 24px;border:1px solid transparent;border-radius:999px;font-family:inherit;font-size:17px;font-weight:600;text-decoration:none;cursor:pointer}
.head .btn{margin-top:24px}
.primary{background:var(--accent);color:var(--onaccent)}
.secondary{background:transparent;color:var(--ink);border-color:var(--hair)}
.btn[aria-disabled="true"],.btn:disabled{opacity:.4;pointer-events:none;cursor:default}
.hint{font-size:14px;line-height:1.5;color:var(--muted);max-width:340px;margin:20px auto 0}
.code{font-size:clamp(40px,13vw,56px);font-weight:800;letter-spacing:.12em;padding-left:.12em;font-variant-numeric:tabular-nums;line-height:1;margin:0 0 12px;color:var(--ink);user-select:all;-webkit-user-select:all}
.code.missing{font-size:18px;font-weight:500;letter-spacing:0;padding-left:0;color:var(--muted)}
.shot{display:block;width:100%;max-width:300px;border-radius:28px;margin:32px auto 0}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
.list li{padding:14px 0;border-bottom:1px solid var(--hair)}
.list strong{display:block;font-weight:600}
.list span{display:block;color:var(--muted)}
.prose h2:first-child{margin-top:0}
.prose ul{margin:0 0 12px;padding-left:1.2em}
.prose li{margin:0 0 8px}
.facts{margin:0}
.facts dt{font-size:13px;color:var(--muted);margin:20px 0 2px}
.facts dt:first-child{margin-top:0}
.facts dd{margin:0}
.facts dd+dd{margin-top:10px}
.en{margin-top:56px;padding-top:32px;border-top:1px solid var(--hair)}
.en-title{font-size:22px;line-height:1.25;margin:0 0 6px}
footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--hair);color:var(--muted);font-size:13px;text-align:center}
footer a{color:var(--muted)}
@media (max-width:599px){footer .sep{display:none}footer a{display:block;margin-top:4px}}
</style>
</head>
<body>
<main>
<header class="top">
  <a class="brand" href="index.html"><span class="mark" aria-hidden="true"></span><strong>SlopeTrack</strong></a>
  <nav aria-label="Seiten"><a href="support.html">Support</a><a href="privacy.html">Datenschutz</a><a href="terms.html">Nutzung</a><a href="imprint.html">Impressum</a></nav>
</header>

<section class="head">
  <h1>Ein Tipp startet den Skitag</h1>
  <p class="lead">Abfahrten, Höhenmeter, Tempo – und Duelle mit Freunden.</p>
  <a class="btn primary" id="store" href="#" aria-disabled="true">Bald im App Store</a>
  <img class="shot" src="img/tagesbilanz.png" alt="Tagesbilanz in SlopeTrack: Höhenmeter, Abfahrten, Top-Speed">
</section>

<section class="en center" lang="en">
  <p class="overline">English</p>
  <h2 class="en-title">One tap starts your ski day</h2>
  <p class="lead">Runs, vertical, speed – and duels with friends.</p>
</section>

<footer><span>© 2026 TORCHTECHNOLOGY LTD</span><span class="sep" aria-hidden="true"> · </span><a href="mailto:hello@torchtechnology.de">hello@torchtechnology.de</a></footer>
</main>
<script>
// App Store URL — set once the App Store Connect record exists (same value as kAppStoreUrl in the app).
var STORE_URL='';
if(STORE_URL){var b=document.getElementById('store');b.href=STORE_URL;b.textContent='Gratis im App Store laden';b.removeAttribute('aria-disabled');}
</script>
</body>
</html>
